<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fedix Coins — Numismática</title>
  <link rel="icon" type="image/png" href="images/background/fedix.png">

  <!-- ── SEO ── -->
  <meta name="description" content="Fedix Coins — Empresa numismática de Mar del Plata, Argentina. Monedas de colección de USA, Argentina y Uruguay. Envíos a todo el país.">

  <!-- ── Open Graph (WhatsApp, Facebook, Telegram, LinkedIn) ── -->
  <meta property="og:type"         content="website">
  <meta property="og:site_name"    content="Fedix Coins">
  <meta property="og:url"          content="https://fedixcoins.com.ar/">
  <meta property="og:title"        content="Fedix Coins">
  <meta property="og:description"  content="Empresa numismática de Mar del Plata, Argentina. Monedas de USA, Argentina y Uruguay. Envíos a todo el país.">
  <meta property="og:image"        content="https://fedixcoins.com.ar/images/background/og_image.jpg">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale"       content="es_AR">

  <!-- ── Twitter / X Card ── -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Fedix Coins">
  <meta name="twitter:description" content="Empresa numismática de Mar del Plata, Argentina. Monedas de USA, Argentina y Uruguay. Envíos a todo el país.">
  <meta name="twitter:image"       content="https://fedixcoins.com.ar/images/background/og_image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <!-- Background coins -->
    <div class="header-coins" aria-hidden="true">
      <img src="images/background/walkingliberty.png" class="hc hc-1">
      <img src="images/background/seateddollar.png"   class="hc hc-2">
      <img src="images/background/buffalo.png"         class="hc hc-3">
      <img src="images/background/indian.png"          class="hc hc-4">
      <img src="images/background/peace_21.png"        class="hc hc-5">
      <img src="images/background/seated_quarter.png"  class="hc hc-6">
    </div>
    <!-- Content (above coins) -->
    <div class="header-content">
      <div class="header-toggles">
        <div class="currency-toggle" id="currency-toggle">
          <button class="currency-btn" data-currency="USD">USD</button>
          <span class="currency-sep">|</span>
          <button class="currency-btn" data-currency="ARS">ARS</button>
        </div>
        <div class="lang-toggle" id="lang-toggle">
          <button class="lang-btn" data-lang="es">ES</button>
          <span class="lang-sep">|</span>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
      <a href="index.html" class="brand-link">
        <div class="brand-wrapper">
          <img src="images/background/fedix.png" class="fedix-logo" alt="Fedix Coins">
          <h1 class="brand">Fedix Coins</h1>
        </div>
      </a>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="header-rule"><span>◆</span></div>
    </div>
  </header>

  <!-- ── Main nav ── -->
  <nav class="main-nav">
    <button class="nav-tab active" data-section="coins" data-i18n="nav_coins"></button>
    <button class="nav-tab" data-section="books" data-i18n="nav_books"></button>
    <button class="nav-tab" data-section="about" data-i18n="nav_about"></button>
  </nav>

  <!-- ── Coins section ── -->
  <section id="section-coins">
    <div class="controls">
      <div class="search-wrap">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search" class="search-input"
               data-i18n-placeholder="search_placeholder">
      </div>

      <select id="filter-country" class="ctrl-select">
        <option value="" data-i18n="all_countries"></option>
      </select>

      <select id="filter-region" class="ctrl-select" hidden>
        <option value="" data-i18n="all_regions"></option>
      </select>

      <select id="filter-condition" class="ctrl-select">
        <option value="" data-i18n="all_grades"></option>
      </select>

      <select id="sort" class="ctrl-select">
        <option value=""           data-i18n="sort_label"></option>
        <option value="price-asc"  data-i18n="sort_price_asc"></option>
        <option value="price-desc" data-i18n="sort_price_desc"></option>
        <option value="year-asc"   data-i18n="sort_year_asc"></option>
        <option value="year-desc"  data-i18n="sort_year_desc"></option>
      </select>

      <span class="result-count" id="result-count"></span>
    </div>
    <main id="grid"></main>

    <div class="pagination-bar" id="pagination-bar">
      <div class="per-page-wrap">
        <span class="per-page-label" data-i18n="per_page_label"></span>
        <select id="per-page" class="ctrl-select">
          <option value="12">12</option>
          <option value="24">24</option>
          <option value="48">48</option>
          <option value="96">96</option>
        </select>
      </div>
      <nav id="page-nav" class="page-nav" aria-label="Pagination"></nav>
    </div>
  </section>

  <!-- ── Albums & Catalogs section ── -->
  <section id="section-books" hidden>
    <div class="controls">
      <select id="books-filter-country" class="ctrl-select">
        <option value="" data-i18n="all_countries"></option>
      </select>

      <div class="book-type-filters">
        <label class="book-type-check">
          <input type="checkbox" id="books-type-album" value="album">
          <span data-i18n="book_type_album"></span>
        </label>
        <label class="book-type-check">
          <input type="checkbox" id="books-type-catalog" value="catalog">
          <span data-i18n="book_type_catalog"></span>
        </label>
      </div>

      <span class="result-count" id="books-result-count"></span>
    </div>
    <main id="books-grid"></main>
  </section>

  <!-- ── About section ── -->
  <section id="section-about" class="about-section" hidden>
    <div class="about-inner">
      <h2 class="about-title" data-i18n="about_title"></h2>
      <div class="about-rule"><span>◆</span></div>
      <p class="about-body" data-i18n="about_body"></p>
      <div class="about-stats">
        <div class="stat-card">
          <span class="stat-icon">◎</span>
          <span class="stat-text" data-i18n="stat_founded"></span>
        </div>
        <div class="stat-card">
          <span class="stat-icon">◎</span>
          <span class="stat-text" data-i18n="stat_location"></span>
        </div>
        <div class="stat-card">
          <span class="stat-icon">◎</span>
          <span class="stat-text" data-i18n="stat_shipping"></span>
        </div>
        <div class="stat-card">
          <span class="stat-icon">◎</span>
          <span class="stat-text" data-i18n="stat_specialty"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Footer ── -->
  <footer>
    <div class="footer-coins" aria-hidden="true">
      <img src="images/background/shield.png"  class="fc fc-1">
      <img src="images/background/lincoln.png" class="fc fc-3">
      <img src="images/background/trade.png"   class="fc fc-2">
      <img src="images/background/standing.png" class="fc fc-4">
    </div>
    <div class="footer-inner">
      <nav class="footer-nav">
        <button class="footer-link" data-section="coins" data-i18n="nav_coins"></button>
        <span class="footer-sep">·</span>
        <button class="footer-link" data-section="books" data-i18n="nav_books"></button>
        <span class="footer-sep">·</span>
        <button class="footer-link" data-section="about" data-i18n="nav_about"></button>
      </nav>
      <div class="footer-contact">
        <span data-i18n="footer_contact_label"></span>:&nbsp;
        <a href="https://wa.me/5492235831244" class="footer-wa" target="_blank" rel="noopener">
          +54 9 223 583-1244
        </a>
      </div>
      <p class="footer-rights" data-i18n="footer_rights"></p>
    </div>
  </footer>

  <script src="i18n.js"></script>
  <script src="currency.js"></script>
  <script src="script.js"></script>
</body>
</html>
