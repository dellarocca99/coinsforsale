<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fedix Coins — Numismática</title>
  <link rel="icon" type="image/png" href="images/background/fedix.png">

  <!-- ── SEO ── -->
  <meta name="description" content="Fedix Coins — Empresa numismática de Mar del Plata, Argentina. Monedas de colección de USA, Argentina y Uruguay.">

  <!-- ── Open Graph ── -->
  <meta property="og:type"         content="website">
  <meta property="og:site_name"    content="Fedix Coins">
  <meta property="og:url"          content="https://fedixcoins.com.ar/">
  <meta property="og:title"        content="Fedix Coins">
  <meta property="og:description"  content="Empresa numismática de Mar del Plata, Argentina. Monedas de USA, Argentina y Uruguay. Envíos a todo el país.">
  <meta property="og:image"        content="https://fedixcoins.com.ar/images/background/og_image.jpg">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale"       content="es_AR">

  <!-- ── Twitter / X Card ── -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Fedix Coins">
  <meta name="twitter:description" content="Empresa numismática de Mar del Plata, Argentina. Monedas de USA, Argentina y Uruguay. Envíos a todo el país.">
  <meta name="twitter:image"       content="https://fedixcoins.com.ar/images/background/og_image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── Header ── -->
  <header class="detail-header">
    <div class="header-coins header-coins-sm" aria-hidden="true">
      <img src="images/background/barberhalf.png" class="hc hc-sm-1">
      <img src="images/background/standing.png"   class="hc hc-sm-2">
    </div>
    <div class="header-content">
      <div class="header-toggles">
        <div class="currency-toggle" id="currency-toggle">
          <button class="currency-btn" data-currency="USD">USD</button>
          <span class="currency-sep">|</span>
          <button class="currency-btn" data-currency="ARS">ARS</button>
        </div>
        <div class="lang-toggle" id="lang-toggle">
          <button class="lang-btn" data-lang="es">ES</button>
          <span class="lang-sep">|</span>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
      <a href="index.html" class="brand-link">
        <div class="brand-wrapper brand-wrapper-inline">
          <img src="images/background/fedix.png" class="fedix-logo" alt="Fedix Coins">
          <h1 class="brand">Fedix Coins</h1>
        </div>
      </a>
    </div>
  </header>

  <a href="index.html" class="back-btn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
    <span data-i18n="back"></span>
  </a>

  <div class="detail-page">
    <div id="item-detail"></div>
  </div>

  <!-- ── Lightbox ── -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close"  id="lightbox-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 9 12 15 19"/></svg>
    </button>
    <img src="" id="lightbox-img" alt="Enlarged coin photo">
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 5 15 12 9 19"/></svg>
    </button>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

  <!-- ── Footer ── -->
  <footer>
    <div class="footer-coins" aria-hidden="true">
      <img src="images/background/shield.png"  class="fc fc-1">
      <img src="images/background/lincoln.png" class="fc fc-3">
      <img src="images/background/trade.png"   class="fc fc-2">
      <img src="images/background/standing.png" class="fc fc-4">
    </div>
    <div class="footer-inner">
      <nav class="footer-nav">
        <a href="index.html" class="footer-link" data-i18n="nav_coins"></a>
        <span class="footer-sep">·</span>
        <a href="index.html#about" class="footer-link" data-i18n="nav_about"></a>
      </nav>
      <div class="footer-contact">
        <span data-i18n="footer_contact_label"></span>:&nbsp;
        <a href="https://wa.me/5492235831244" class="footer-wa" target="_blank" rel="noopener">
          +54 9 223 583-1244
        </a>
      </div>
      <p class="footer-rights" data-i18n="footer_rights"></p>
    </div>
  </footer>

  <script src="i18n.js"></script>
  <script src="currency.js"></script>
  <script src="item.js"></script>
</body>
</html>
